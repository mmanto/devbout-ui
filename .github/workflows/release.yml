name: release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC: trusted publishing (sin NPM_TOKEN)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 trae npm 11.x: trusted publishing requiere npm >= 11.5.1 y
          # Node >= 22.14.0. Sin caché a propósito (builds de release).
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck

      # Con cambios pendientes en .changeset/ abre/actualiza el PR de versiones;
      # al mergearlo publica en npm. La autenticación sale del id-token de
      # GitHub Actions: el CLI de npm detecta el entorno OIDC y lo canjea por un
      # token efímero, así que no hay secret que rotar.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
