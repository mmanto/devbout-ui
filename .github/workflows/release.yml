name: release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC: trusted publishing (sin NPM_TOKEN)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Sin `registry-url` A PROPÓSITO. Con `registry-url`, setup-node escribe
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` en un .npmrc
      # temporal (y exporta NPM_CONFIG_USERCONFIG): npm da la autenticación por
      # resuelta, nunca hace el intercambio OIDC y publica con ese token — que
      # es un placeholder — así que el PUT del paquete scopeado vuelve
      # `E404 ... PUT https://registry.npmjs.org/@scope%2fpkg - Not found`.
      # El registry por defecto de npm ya es registry.npmjs.org.
      # Ver actions/setup-node#1551 y npm/documentation#1960.
      #
      # Node 24 trae npm 11.x: trusted publishing requiere npm >= 11.5.1 y
      # Node >= 22.14.0. Sin caché a propósito (builds de release).
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck

      # Deja en el log qué configuración de auth ve npm (sin valores).
      - name: npm auth diagnostics
        run: |
          set +e
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN=<set, ${#NODE_AUTH_TOKEN} chars>"
          else
            echo "NODE_AUTH_TOKEN=<unset>"
          fi
          echo "--- .npmrc ---"
          if [ -f "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" ]; then
            sed -E 's/(_authToken=).*/\1<redacted>/' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          else
            echo "(sin .npmrc)"
          fi
          echo "registry: $(npm config get registry)"

      # Diagnóstico del trusted publishing: hace el intercambio OIDC a mano y
      # muestra qué responde el registry (si no hay trusted publisher, o si no
      # permite `npm publish`, acá se ve).
      - name: OIDC exchange diagnostics
        run: |
          set +e
          uri="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          tok="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          if [ -z "$uri" ] || [ -z "$tok" ]; then
            echo "OIDC no disponible en el runner (${uri:-sin url})"; exit 0
          fi
          idt_json=$(curl -sS -H "Authorization: bearer $tok" "${uri}&audience=npm:registry.npmjs.org")
          idt=$(printf '%s' "$idt_json" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          if [ -z "$idt" ]; then
            echo "no se pudo obtener el id_token: $(printf '%s' "$idt_json" | head -c 300)"
            exit 0
          fi
          echo "id_token OK (${#idt} chars)"
          code=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@mmanto%2fdevbout-ui" \
            -H "Authorization: Bearer $idt")
          echo "exchange HTTP $code"
          if [ "$code" = "200" ]; then
            echo "exchange OK (token recibido, no impreso)"
          else
            echo "exchange FAILED:"; cat /tmp/exchange.json; echo
          fi

      # Con cambios pendientes en .changeset/ abre/actualiza el PR de versiones;
      # al mergearlo publica en npm. La autenticación sale del id-token de
      # GitHub Actions: el CLI de npm detecta el entorno OIDC y lo canjea por un
      # token efímero, así que no hay secret que rotar.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
